<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply Discount Code - Craft Royale</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .discount-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 14px;
        }

        .cart-summary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        .cart-summary h3 {
            font-size: 16px;
            margin-bottom: 15px;
            opacity: 0.9;
        }

        .price-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 15px;
        }

        .price-row.total {
            border-top: 2px solid rgba(255, 255, 255, 0.3);
            padding-top: 10px;
            margin-top: 10px;
            font-size: 20px;
            font-weight: 700;
        }

        .price-row.discount {
            color: #4ade80;
            font-weight: 600;
        }

        .discount-form {
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
            font-size: 14px;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        .input-group input {
            flex: 1;
            padding: 14px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            text-transform: uppercase;
            font-weight: 600;
            transition: all 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn-apply {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 14px 25px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
            white-space: nowrap;
        }

        .btn-apply:hover {
            transform: translateY(-2px);
        }

        .btn-apply:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-remove {
            background: #ef4444;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-remove:hover {
            background: #dc2626;
        }

        .message {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: 500;
            display: none;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.success {
            background: #d1fae5;
            color: #065f46;
            border: 2px solid #6ee7b7;
        }

        .message.error {
            background: #fee2e2;
            color: #991b1b;
            border: 2px solid #fca5a5;
        }

        .applied-code {
            background: #f0fdf4;
            border: 2px solid #86efac;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }

        .applied-code.show {
            display: block;
        }

        .applied-code-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .code-badge {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 8px 15px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 16px;
        }

        .code-details {
            font-size: 14px;
            color: #065f46;
        }

        .icon {
            margin-right: 8px;
        }
    </style>
</head>

<body>
    <div class="discount-container">
        <div class="header">
            <h1>🎟️ Apply Discount Code</h1>
            <p>Enter your discount code to save on your order</p>
        </div>

        <!-- Cart Summary -->
        <div class="cart-summary">
            <h3>Order Summary</h3>
            <div class="price-row">
                <span>Subtotal:</span>
                <span id="subtotal">₹1,000.00</span>
            </div>
            <div class="price-row discount" id="discount-row" style="display: none;">
                <span><i class="fas fa-tag icon"></i>Discount (<span id="discount-code-name"></span>):</span>
                <span id="discount-amount">-₹0.00</span>
            </div>
            <div class="price-row total">
                <span>Total:</span>
                <span id="total">₹1,000.00</span>
            </div>
        </div>

        <!-- Message Area -->
        <div id="message" class="message"></div>

        <!-- Applied Code Display -->
        <div id="applied-code" class="applied-code">
            <div class="applied-code-header">
                <span class="code-badge" id="applied-code-badge"></span>
                <button class="btn-remove" onclick="removeDiscount()">
                    <i class="fas fa-times"></i> Remove
                </button>
            </div>
            <div class="code-details" id="code-details"></div>
        </div>

        <!-- Discount Form -->
        <div class="discount-form">
            <div class="form-group">
                <label for="discount-code">
                    <i class="fas fa-ticket-alt icon"></i>Discount Code
                </label>
                <div class="input-group">
                    <input type="text" id="discount-code" placeholder="Enter code (e.g., FIRSTSALE)" maxlength="50">
                    <button class="btn-apply" onclick="applyDiscount()">
                        <i class="fas fa-check"></i> Apply
                    </button>
                </div>
            </div>
        </div>

        <!-- Sample Codes Info -->
        <div style="background: #f9fafb; padding: 15px; border-radius: 10px; font-size: 13px; color: #666;">
            <strong>💡 Try these codes:</strong><br>
            <code
                style="background: white; padding: 4px 8px; border-radius: 4px; margin: 5px 5px 0 0; display: inline-block;">FIRSTSALE</code>
            <code
                style="background: white; padding: 4px 8px; border-radius: 4px; margin: 5px 5px 0 0; display: inline-block;">WELCOME20</code>
            <code
                style="background: white; padding: 4px 8px; border-radius: 4px; margin: 5px 5px 0 0; display: inline-block;">SAVE15</code>
        </div>
    </div>

    <script>
        let cartSubtotal = 1000; // Default cart total
        let appliedDiscount = 0;
        let appliedCodeData = null;

        function updateDisplay() {
            const total = cartSubtotal - appliedDiscount;

            document.getElementById('subtotal').textContent = '₹' + cartSubtotal.toFixed(2);
            document.getElementById('total').textContent = '₹' + total.toFixed(2);

            if (appliedDiscount > 0) {
                document.getElementById('discount-row').style.display = 'flex';
                document.getElementById('discount-amount').textContent = '-₹' + appliedDiscount.toFixed(2);
            } else {
                document.getElementById('discount-row').style.display = 'none';
            }
        }

        function showMessage(message, type) {
            const messageEl = document.getElementById('message');
            messageEl.textContent = message;
            messageEl.className = 'message ' + type;
            messageEl.style.display = 'block';

            setTimeout(() => {
                messageEl.style.display = 'none';
            }, 5000);
        }

        async function applyDiscount() {
            const codeInput = document.getElementById('discount-code');
            const code = codeInput.value.trim().toUpperCase();

            if (!code) {
                showMessage('Please enter a discount code', 'error');
                return;
            }

            const applyBtn = document.querySelector('.btn-apply');
            applyBtn.disabled = true;
            applyBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Applying...';

            try {
                const formData = new FormData();
                formData.append('code', code);
                formData.append('cart_total', cartSubtotal);

                const response = await fetch('apply_discount_code.php', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.success) {
                    appliedDiscount = data.discount;
                    appliedCodeData = data.code_data;

                    // Update display
                    updateDisplay();

                    // Show applied code info
                    document.getElementById('applied-code-badge').textContent = data.code_data.code;
                    document.getElementById('discount-code-name').textContent = data.code_data.code;
                    document.getElementById('code-details').innerHTML = `
                        <i class="fas fa-check-circle icon"></i>
                        <strong>${data.code_data.percentage}% discount applied</strong><br>
                        You saved ₹${data.discount.toFixed(2)}!
                        ${data.code_data.description ? '<br>' + data.code_data.description : ''}
                    `;
                    document.getElementById('applied-code').classList.add('show');

                    // Hide input
                    document.querySelector('.discount-form').style.display = 'none';

                    showMessage(data.message, 'success');
                } else {
                    showMessage(data.message, 'error');
                }
            } catch (error) {
                showMessage('Error applying discount code. Please try again.', 'error');
                console.error('Error:', error);
            } finally {
                applyBtn.disabled = false;
                applyBtn.innerHTML = '<i class="fas fa-check"></i> Apply';
            }
        }

        function removeDiscount() {
            appliedDiscount = 0;
            appliedCodeData = null;

            updateDisplay();

            document.getElementById('applied-code').classList.remove('show');
            document.querySelector('.discount-form').style.display = 'block';
            document.getElementById('discount-code').value = '';

            showMessage('Discount code removed', 'success');
        }

        // Allow Enter key to apply discount
        document.getElementById('discount-code').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                applyDiscount();
            }
        });

        // Initialize display
        updateDisplay();
    </script>
</body>

</html>
